services:
  electron-webrtc-clean:
    build:
      context: .
      dockerfile: Dockerfile.clean
    ports:
      - "8081:8080"
      - "3479:3478/tcp"
      - "3479:3478/udp"
      - "5350:5349/tcp"
      - "5350:5349/udp"
    environment:
      - DISPLAY=:99
      - ELECTRON_DISABLE_SANDBOX=1
    volumes:
      - ./main.js:/app/main.js
      - ./preload.js:/app/preload.js
      - ./package.json:/app/package.json
      - ./turnserver.conf:/etc/turnserver.conf
    shm_size: '2gb'
    restart: unless-stopped

