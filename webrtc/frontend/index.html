<!DOCTYPE html>
<html>
<head>
    <title>ElectronSim WebRTC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #0b0f19; color: #e5e7eb; }
        .container { max-width: 960px; margin: 24px auto; padding: 16px; }
        video { width: 100%; max-height: 70vh; background: #000; border: 1px solid #374151; border-radius: 8px; cursor: pointer; }
        button { padding: 12px 20px; background: #10a37f; color: white; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; margin: 8px 4px; }
        button:hover { background: #0d8c6b; }
        button.secondary { background: #374151; }
        .status { margin: 12px 0; color: #9ca3af; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ElectronSim (Modal WebRTC)</h1>
        <p class="status" id="status">Click Connect to start receiving video stream from Modal</p>
        <div>
            <button id="start">Connect</button>
            <button id="stop" class="secondary" style="display:none;">Disconnect</button>
        </div>
        <div style="margin-top:16px;">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script type="module">
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('start');
        const stopBtn = document.getElementById('stop');
        const remoteVideo = document.getElementById('remoteVideo');

        let ws = null;
        let pc = null;
        let dc = null;

        function updateStatus(msg) {
            statusEl.textContent = msg;
            console.log(msg);
        }

        function generatePeerId() {
            return 'peer_' + Math.random().toString(36).substring(2, 11);
        }

        async function connect() {
            const peerId = generatePeerId();
            const wsUrl = location.origin.replace(/^http/, 'ws') + '/ws/' + peerId;
            
            updateStatus('Connecting to ' + wsUrl);
            
            pc = new RTCPeerConnection({
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                ]
            });

            // Add a transceiver to receive video (but not send)
            pc.addTransceiver('video', { direction: 'recvonly' });

            pc.ontrack = (e) => { 
                updateStatus('Video stream received! Click on the blue button.');
                remoteVideo.srcObject = e.streams[0]; 
            };

            pc.onconnectionstatechange = () => {
                updateStatus('Connection: ' + pc.connectionState);
            };

            // Create data channel for sending clicks
            dc = pc.createDataChannel('input');
            dc.onopen = () => updateStatus('Ready - click on the blue button!');
            dc.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.type === 'counter') {
                    updateStatus('Counter: ' + data.value + ' (click the button again!)');
                }
            };

            // Create offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => { 
                updateStatus('WebSocket connected - sending offer...');
                ws.send(JSON.stringify({ 
                    type: 'offer', 
                    sdp: offer.sdp,
                    peer_id: peerId 
                }));
            };
            
            ws.onclose = () => updateStatus('WebSocket closed');
            ws.onerror = () => updateStatus('WebSocket error');
            
            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.sdp && msg.type) {
                    updateStatus('Received answer - establishing connection...');
                    await pc.setRemoteDescription({ type: msg.type, sdp: msg.sdp });
                } else if (msg.type === 'ice_candidate' && msg.candidate) {
                    try {
                        await pc.addIceCandidate({
                            candidate: msg.candidate.candidate_sdp,
                            sdpMid: msg.candidate.sdpMid,
                            sdpMLineIndex: msg.candidate.sdpMLineIndex
                        });
                    } catch(err) {
                        console.error('ICE candidate error:', err);
                    }
                }
            };

            pc.onicecandidate = (e) => {
                if (e.candidate && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'ice_candidate',
                        candidate: {
                            candidate_sdp: e.candidate.candidate,
                            sdpMid: e.candidate.sdpMid,
                            sdpMLineIndex: e.candidate.sdpMLineIndex
                        }
                    }));
                }
            };
        }

        function disconnect() {
            updateStatus('Disconnected');
            try { ws && ws.close(); } catch {}
            try { pc && pc.close(); } catch {}
            ws = null; pc = null; dc = null;
            remoteVideo.srcObject = null;
        }

        // Handle clicks on video to send to Modal
        remoteVideo.addEventListener('click', (ev) => {
            if (!dc || dc.readyState !== 'open') {
                updateStatus('Data channel not open yet - wait a moment');
                return;
            }
            
            const rect = remoteVideo.getBoundingClientRect();
            const x = Math.round((ev.clientX - rect.left) * (640 / rect.width));
            const y = Math.round((ev.clientY - rect.top) * (360 / rect.height));
            
            dc.send(JSON.stringify({ type: 'click', x, y }));
        });

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            try {
                await connect();
            } catch(err) {
                updateStatus('Error: ' + err.message);
                startBtn.style.display = 'inline-block';
                stopBtn.style.display = 'none';
            }
        });

        stopBtn.addEventListener('click', () => {
            disconnect();
            stopBtn.style.display = 'none';
            startBtn.style.display = 'inline-block';
        });
    </script>
</body>
</html>
