app = "chatgpt-login-webrtc"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

# Expose TURN server ports for WebRTC
[[services]]
  internal_port = 3478
  protocol = "udp"

  [[services.ports]]
    port = 3478

[[services]]
  internal_port = 5349
  protocol = "tcp"

  [[services.ports]]
    port = 5349

